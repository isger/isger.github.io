<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>World Cup 2026 · UK TV Guide</title>
  <meta name="description" content="Which BBC or ITV channel is showing each World Cup 2026 match in the UK, with live streaming links.">
  <style>
    :root {
      --bbc: #CC0000;
      --itv: #1a1a1a;
      --bg: #EAECEF;
      --card: #ffffff;
      --text: #111827;
      --muted: #6B7280;
      --border: #E5E7EB;
      --live: #16A34A;
      --today: #1D4ED8;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Header ────────────────────── */
    header {
      background: #0F172A;
      color: white;
      padding: 1.5rem 1rem 1.75rem;
      text-align: center;
    }

    .header-ball { font-size: 2rem; line-height: 1; margin-bottom: 0.45rem; }

    header h1 {
      font-size: 1.3rem;
      font-weight: 800;
      letter-spacing: -0.3px;
    }

    .header-meta {
      margin-top: 0.3rem;
      font-size: 0.78rem;
      opacity: 0.5;
    }

    /* ── Page layout ── */
    .page-wrap {
      margin: 0 auto;
    }

    .center-col {
      max-width: 680px;
      margin: 0 auto;
    }

    /* ── Legend ────────────────────── */
    .legend-wrap {
      padding: 0.85rem 1rem 0.2rem;
    }

    .legend {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1.4rem;
      font-size: 0.75rem;
      color: var(--muted);
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .legend-dot {
      width: 12px;
      height: 12px;
      border-radius: 3px;
      flex-shrink: 0;
    }

    .scotland-note {
      text-align: center;
      margin-top: 0.55rem;
      font-size: 0.7rem;
      color: var(--muted);
    }

    /* ── Main ──────────────────────── */
    main {
      padding: 0.4rem 0.75rem 5rem;
    }

    /* ── Day section ───────────────── */
    .day-section { margin-top: 1.1rem; }

    .day-header {
      display: flex;
      align-items: center;
      gap: 0.55rem;
      margin-bottom: 0.5rem;
      padding: 0 0.15rem;
    }

    .day-label {
      font-size: 0.87rem;
      font-weight: 700;
      color: var(--text);
    }

    .today-chip {
      background: var(--today);
      color: white;
      font-size: 0.6rem;
      font-weight: 800;
      letter-spacing: 0.6px;
      padding: 0.18rem 0.55rem;
      border-radius: 99px;
      text-transform: uppercase;
    }

    /* ── Match card ────────────────── */
    .match-card {
      background: var(--card);
      border-radius: 10px;
      margin-bottom: 0.45rem;
      display: flex;
      align-items: stretch;
      overflow: hidden;
      box-shadow: 0 1px 2px rgba(0,0,0,0.06), 0 0 0 1px rgba(0,0,0,0.04);
    }

    .match-card.live-now {
      box-shadow: 0 0 0 2px var(--live), 0 2px 12px rgba(22,163,74,0.15);
    }

    .accent          { width: 5px; flex-shrink: 0; }
    .accent.bbc      { background: var(--bbc); }
    .accent.itv      { background: var(--itv); }
    .accent.both     { background: linear-gradient(180deg, var(--bbc) 50%, var(--itv) 50%); }
    .accent.tbc      { background: var(--border); }

    .card-body {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 0.8rem;
      padding: 0.82rem 0.9rem;
      min-width: 0;
    }

    /* Time */
    .col-time    { text-align: center; min-width: 46px; flex-shrink: 0; }

    .kickoff {
      font-size: 1.1rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      line-height: 1;
    }

    .live-label {
      margin-top: 0.25rem;
      font-size: 0.58rem;
      font-weight: 800;
      color: var(--live);
      text-transform: uppercase;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 3px;
      letter-spacing: 0.4px;
    }

    .pulse {
      width: 5px;
      height: 5px;
      background: var(--live);
      border-radius: 50%;
      flex-shrink: 0;
      animation: pulse 1s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.2; }
    }

    /* Match info */
    .col-match { flex: 1; min-width: 0; }

    .teams {
      font-size: 0.93rem;
      font-weight: 600;
      line-height: 1.35;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .stage {
      font-size: 0.68rem;
      color: var(--muted);
      margin-top: 0.12rem;
    }

    /* Channel */
    .col-channel { flex-shrink: 0; text-align: right; }

    .badge {
      display: inline-block;
      padding: 0.26rem 0.62rem;
      border-radius: 6px;
      font-size: 0.74rem;
      font-weight: 800;
      letter-spacing: 0.2px;
      white-space: nowrap;
    }

    .badge.bbc  { background: var(--bbc); color: white; }
    .badge.itv  { background: var(--itv); color: white; }
    .badge.both { background: #5B21B6; color: white; }
    .badge.tbc  { background: var(--border); color: var(--muted); }

    .ch-name {
      font-size: 0.65rem;
      color: var(--muted);
      margin-top: 0.18rem;
    }

    .watch-btn {
      display: inline-block;
      margin-top: 0.18rem;
      font-size: 0.65rem;
      color: var(--today);
      text-decoration: none;
      font-weight: 600;
    }

    .watch-btn:hover { text-decoration: underline; }

    .match-card.past { opacity: 0.36; }

    /* Empty state */
    .empty {
      background: var(--card);
      border-radius: 10px;
      padding: 1.5rem;
      text-align: center;
      color: var(--muted);
      font-size: 0.88rem;
      box-shadow: 0 1px 2px rgba(0,0,0,0.06);
    }

    footer {
      text-align: center;
      padding: 1.5rem 1rem 2.5rem;
      font-size: 0.68rem;
      color: var(--muted);
      line-height: 1.7;
    }

    @media (max-width: 380px) {
      .kickoff    { font-size: 0.9rem; }
      .teams      { font-size: 0.8rem; }
      .badge      { font-size: 0.65rem; padding: 0.2rem 0.45rem; }
      .card-body  { padding: 0.65rem 0.7rem; gap: 0.55rem; }
      .col-time   { min-width: 38px; }
    }
  </style>
</head>

  { date:"2026-07-19", time:"20:00", match:"TBC",                          group:"Final",            broadcaster:"Both", channel:"BBC One & ITV1", stream:"BBC iPlayer / ITVX" },
];

const FLAGS = {
  'Ivory Coast':'🇨🇮', 'Ecuador':'🇪🇨',     'Sweden':'🇸🇪',        'Tunisia':'🇹🇳',
  'Spain':'🇪🇸',        'Cape Verde':'🇨🇻',  'Belgium':'🇧🇪',       'Egypt':'🇪🇬',
  'Saudi Arabia':'🇸🇦', 'Uruguay':'🇺🇾',     'Iran':'🇮🇷',          'New Zealand':'🇳🇿',
  'France':'🇫🇷',       'Senegal':'🇸🇳',     'Iraq':'🇮🇶',          'Norway':'🇳🇴',
  'Argentina':'🇦🇷',    'Algeria':'🇩🇿',     'Austria':'🇦🇹',       'Jordan':'🇯🇴',
  'Portugal':'🇵🇹',     'DR Congo':'🇨🇩',    'England':'🏴󠁧󠁢󠁥󠁮󠁧󠁿',     'Croatia':'🇭🇷',
  'Ghana':'🇬🇭',        'Panama':'🇵🇦',      'Uzbekistan':'🇺🇿',    'Colombia':'🇨🇴',
  'Czech Republic':'🇨🇿','South Africa':'🇿🇦','Switzerland':'🇨🇭',  'Bosnia-Herzegovina':'🇧🇦',
  'Canada':'🇨🇦',       'Qatar':'🇶🇦',       'Mexico':'🇲🇽',        'South Korea':'🇰🇷',
  'USA':'🇺🇸',          'Australia':'🇦🇺',   'Scotland':'🏴󠁧󠁢󠁳󠁣󠁴󠁿',     'Morocco':'🇲🇦',
  'Brazil':'🇧🇷',       'Haiti':'🇭🇹',       'Turkey':'🇹🇷',        'Paraguay':'🇵🇾',
  'Netherlands':'🇳🇱',  'Germany':'🇩🇪',     'Curacao':'🇨🇼',       'Japan':'🇯🇵',
};

function withFlags(match) {
  if (!match || match === 'TBC') return 'TBC';
  return match.split(' v ').map(t => {
    const f = FLAGS[t.trim()] || '';
    return f ? `${f} ${t.trim()}` : t.trim();
  }).join(' v ');
}

function toKickoff(date, time) {
  return new Date(`${date}T${time}:00+01:00`);
}

function fmtTime(dt) {
  return dt.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit', hour12: false });
}

function fmtDayHeading(dateStr) {
  const d = new Date(`${dateStr}T12:00:00+01:00`);
  return d.toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long' });
}

function todayStr() {
  const n = new Date();
  return [
    n.getFullYear(),
    String(n.getMonth() + 1).padStart(2, '0'),
    String(n.getDate()).padStart(2, '0'),
  ].join('-');
}

function streamURL(m) {
  const c = m.channel || '';
  const s = m.stream  || '';
  if (s.includes('BBC') || c.includes('BBC')) {
    return c.includes('Two')
      ? 'https://www.bbc.co.uk/iplayer/live/bbctwo'
      : 'https://www.bbc.co.uk/iplayer/live/bbcone';
  }
  return 'https://www.itv.com/watch/live';
}

function bcClass(b) {
  if (b === 'BBC')  return 'bbc';
  if (b === 'ITV')  return 'itv';
  if (b === 'Both') return 'both';
  return 'tbc';
}

function renderCard(m, now) {
  const ko  = toKickoff(m.date, m.time);
  const end = new Date(ko.getTime() + 2 * 3600000);
  const isLive = now >= ko && now < end;
  const isPast = now >= end;
  const bc     = bcClass(m.broadcaster);
  const isTBC  = m.broadcaster === 'TBC';
  const isBoth = m.broadcaster === 'Both';

  const time       = fmtTime(ko);
  const teams      = withFlags(m.match);
  const badgeLabel = isBoth ? 'BBC & ITV' : (m.broadcaster || 'TBC');

  const statusHTML = isLive
    ? `<div class="live-label"><span class="pulse"></span>LIVE</div>`
    : '';

  const channelLine = m.channel !== 'TBC'
    ? `<div class="ch-name">${m.channel}</div>`
    : '';

  // Watch link — only shown for upcoming and live games
  let watchHTML = '';
  if (!isTBC && !isPast) {
    if (isBoth) {
      watchHTML = `<a href="https://www.bbc.co.uk/iplayer/live/bbcone" target="_blank" rel="noopener noreferrer" class="watch-btn">BBC iPlayer →</a>`;
    } else {
      watchHTML = `<a href="${streamURL(m)}" target="_blank" rel="noopener noreferrer" class="watch-btn">Watch online →</a>`;
    }
  }

  const cardClasses = [
    'match-card',
    isPast ? 'past'     : '',
    isLive ? 'live-now' : '',
  ].filter(Boolean).join(' ');

  return `<div class="${cardClasses}">
  <div class="accent ${bc}"></div>
  <div class="card-body">
    <div class="col-time">
      <div class="kickoff">${time}</div>
      ${statusHTML}
    </div>
    <div class="col-match">
      <div class="teams">${teams}</div>
      <div class="stage">${m.group || ''}</div>
    </div>
    <div class="col-channel">
      <div class="badge ${bc}">${badgeLabel}</div>
      ${channelLine}
      ${watchHTML}
    </div>
  </div>
</div>`;
}

function render() {
  const now   = new Date();
  const today = todayStr();

  const byDate = {};
  MATCHES.forEach(m => {
    (byDate[m.date] = byDate[m.date] || []).push(m);
  });

  const dates = Object.keys(byDate).filter(d => d >= today).sort();

  if (dates.length === 0) {
    document.getElementById('app').innerHTML =
      '<div class="empty">The tournament has ended. What a World Cup! 🏆</div>';
    return;
  }

  const html = dates.map(dateStr => {
    const isToday = dateStr === today;
    const heading = fmtDayHeading(dateStr);
    const cards   = byDate[dateStr].map(m => renderCard(m, now)).join('');

    return `<div class="day-section">
  <div class="day-header">
    <span class="day-label">${heading}</span>
    ${isToday ? '<span class="today-chip">Today</span>' : ''}
  </div>
  ${cards}
</div>`;
  }).join('');

  document.getElementById('app').innerHTML = html;
}

render();
setInterval(render, 60000);
</script>

</body>
